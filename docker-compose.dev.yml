# Development override, always used together with docker-compose.yml (see `make dev`).
# Keep the project on the WSL/Linux filesystem: file events from /mnt/c do not reach the
# container and Fast Refresh stops working.
services:
  app:
    build:
      target: deps
    command: npm run dev
    volumes:
      - .:/app
      # Named volumes, scoped to this Compose project (so separate clones never share
      # them) and kept across restarts. After changing dependencies run `make clean`.
      - node_modules:/app/node_modules
      - next:/app/.next
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  node_modules:
  next:
